# CMEP production stack
# Usage on VPS:
#   cp .env.production.example .env.production
#   # fill secrets, then:
#   docker compose -f docker-compose.production.yml --env-file .env.production up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: cmep-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cmep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-cmep}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cmep} -d ${POSTGRES_DB:-cmep}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [cmep]

  redis:
    image: redis:7-alpine
    container_name: cmep-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks: [cmep]

  api:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: cmep-api
    environment:
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://\( {POSTGRES_USER:-cmep}: \){POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cmep}
      REDIS_HOST: redis
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY}
      JWT_REFRESH_SECRET_KEY: ${JWT_REFRESH_SECRET_KEY:?set JWT_REFRESH_SECRET_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      FRONTEND_URL: ${FRONTEND_URL}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-smtp.gmail.com}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_TLS: ${EMAIL_TLS:-true}
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [cmep]

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
    container_name: cmep-web
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
    depends_on:
      - api
    restart: unless-stopped
    networks: [cmep]

  nginx:
    image: nginx:1.27-alpine
    container_name: cmep-nginx
    ports:
      - "80:80"
      # - "443:443"   # po certbot
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      # - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - web
    restart: unless-stopped
    networks: [cmep]

networks:
  cmep:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
