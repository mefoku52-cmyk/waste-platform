services:
  postgres:
    image: postgres:16-alpine
    container_name: cmep-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cmep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD musi byt nastaveny}
      POSTGRES_DB: ${POSTGRES_DB:-cmep}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cmep} -d ${POSTGRES_DB:-cmep}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cmep-network

  redis:
    image: redis:7-alpine
    container_name: cmep-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - cmep-network

  api:
    image: ${REGISTRY_IMAGE_PREFIX:?REGISTRY_IMAGE_PREFIX musi byt nastaveny}/cmep-api:${IMAGE_TAG:?IMAGE_TAG musi byt nastaveny}
    container_name: cmep-api
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cmep}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD musi byt nastaveny}@postgres:5432/${POSTGRES_DB:-cmep}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY musi byt nastaveny}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3001}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-admin@cmep.dev}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cmep-network

  web:
    image: ${REGISTRY_IMAGE_PREFIX:?REGISTRY_IMAGE_PREFIX musi byt nastaveny}/cmep-web:${IMAGE_TAG:?IMAGE_TAG musi byt nastaveny}
    container_name: cmep-web
    # Server-side API proxy v standalone serveri je zavazny z build-time hodnot
    # (NEXT_PUBLIC_API_BASE_URL / API_PROXY_TARGET). Runtime environment ich
    # nemeni — nastav ich pred `npm run build` / `docker build`.
    environment:
      PORT: 3001
      HOSTNAME: 0.0.0.0
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    networks:
      - cmep-network

networks:
  cmep-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
