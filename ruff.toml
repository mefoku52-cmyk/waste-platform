# Ruff konfigurácia pre waste-platform
# FastAPI projekt — niektoré pravidlá sú nekompatibilné s FastAPI patternmi.

target-version = "py312"
line-length = 100
src = ["app", "tests", "scripts", "migrations"]

extend-exclude = [
    ".venv",
    ".git",
    "__pycache__",
    "*.egg-info",
    "apps/web/node_modules",
    "apps/web/.next",
    "scripts/grok-audit",
    "scripts/fixes",
    "scripts/forensics",
    "scripts/ops",
    "test_debug.py",
]

[lint]
# Základné sady
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]

# Ignoruj pravidlá, ktoré kolidujú s FastAPI/SQLAlchemy patternmi
ignore = [
    "B008",   # FastAPI: Depends()/File()/Query() v defaultoch je SPRÁVNE
    "B904",   # raise from — nechceme všade
    "BLE001", # blind except Exception — máme vlastné error handlery
    "E501",   # line too long — rieši formatter
    "N818",   # exception naming (Error suffix)
    "RUF012", # mutable class attr — SQLAlchemy to používa
    "RUF059", # unused unpacked variable — často potrebné pre tuple unpacking
    "S110",   # try-except-pass — občas zámerné
    "SIM102", # nested if — čitateľnosť
    "TRY203", # re-raise — zámerné pre FastAPI exception handlery
    "TRY401", # redundant exception in logging
]

# Per-file ignorovanie
[lint.per-file-ignores]
"app/modules/*/presentation/*.py" = [
    "B008",   # FastAPI dependencies
]
"app/shared/presentation/*.py" = [
    "B008",
]
"app/tests/**/*.py" = [
    "B008",
    "S101",   # assert v testoch je OK
]
"migrations/**/*.py" = [
    "E501",   # alembic generuje dlhé riadky
    "B008",
]
"scripts/**/*.py" = [
    "E501",
    "B008",
    "BLE001",
]

[lint.isort]
known-first-party = ["app"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = false
skip-magic-trailing-comma = false
