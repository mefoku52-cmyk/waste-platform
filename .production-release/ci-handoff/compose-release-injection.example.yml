# Patch-ready Compose image identity example.
#
# This is NOT automatically inserted into docker-compose.yml.
#
# Application services should consume the CI-provided IMAGE_TAG:
#
# image: cmep-api:${IMAGE_TAG:?IMAGE_TAG must be set}
#
# image: cmep-worker:${IMAGE_TAG:?IMAGE_TAG must be set}
#
# image: cmep-web:${IMAGE_TAG:?IMAGE_TAG must be set}
#
# Production deployment must fail closed if IMAGE_TAG is missing.
#
# PostgreSQL and Redis are infrastructure dependencies and remain
# independently versioned:
#
# postgres:16-alpine
# redis:7-alpine
#
