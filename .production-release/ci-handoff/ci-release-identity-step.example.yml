# Patch-ready CI release identity step.
#
# IMPORTANT:
# This file is an example fragment.
# It is NOT automatically inserted into ci.yml.
#
# Add before application image build steps:

      - name: Establish immutable release identity
        id: release_identity
        shell: bash
        run: |
          set -euo pipefail

          : "${GITHUB_SHA:?GITHUB_SHA is required}"

          case "${GITHUB_SHA}" in
            ''|*[!A-Fa-f0-9]*)
              echo "Invalid GITHUB_SHA" >&2
              exit 2
              ;;
          esac

          RELEASE_ID="sha-${GITHUB_SHA}"
          IMAGE_TAG="release-${GITHUB_SHA}"

          echo "RELEASE_ID=${RELEASE_ID}" >> "${GITHUB_ENV}"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "${GITHUB_ENV}"

          {
            echo "RELEASE_ID=${RELEASE_ID}"
            echo "IMAGE_TAG=${IMAGE_TAG}"
            echo "SOURCE_REVISION=${GITHUB_SHA}"
            echo "MANIFEST_FORMAT_VERSION=1"
          } > release-manifest.env

# Application builds should then use:
#
# cmep-api:${IMAGE_TAG}
# cmep-worker:${IMAGE_TAG}
# cmep-web:${IMAGE_TAG}
#
# Do not use latest.
