<!--
Faithful capture of a real zlatestranky.sk profile card with NO company homepage.

Source: https://www.zlatestranky.sk/hladanie/ekol/  (cards 2, 6, 8 — 3 of 9 cards)

These cards have no `li.link` slot and no `span[itemprop="url"]`. Their ONLY
external anchor is the business-register cross-link:

  https://www.indexpodnikatela.sk/...

The old _extract_card_website() returned the first external anchor, so it
returned the register URL here — not a company website. The fix must return
None so the caller skips the crawl instead of crawling a register page.
-->
