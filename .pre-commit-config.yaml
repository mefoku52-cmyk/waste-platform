repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: ruff check
        language: system
        types_or: [python, pyi]

      - id: ty
        name: ty check
        entry: ty check --exclude 'app/modules/agent_platform_NEW_BACKUP*' --exclude 'final_check.py'
        language: system
        pass_filenames: false
