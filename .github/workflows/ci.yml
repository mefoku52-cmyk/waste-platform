# ============================================
name: ci

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["*"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cmep_test
          POSTGRES_USER: cmep
          POSTGRES_PASSWORD: cmep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cmep -d cmep_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 10

    env:
      APP_ENV: test
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 5432
      DATABASE_NAME: cmep_test
      DATABASE_USER: cmep
      DATABASE_PASSWORD: cmep
      DATABASE_URL: postgresql+asyncpg://cmep:cmep@127.0.0.1:5432/cmep_test
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET_KEY: test-secret-key
      JWT_REFRESH_SECRET_KEY: test-refresh-secret-key
      JWT_ACCESS_TOKEN_EXPIRES_MINUTES: 15
      JWT_REFRESH_TOKEN_EXPIRES_DAYS: 30
      JWT_ALGORITHM: HS256
      S3_ENDPOINT_URL: http://127.0.0.1:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio123
      S3_BUCKET_DOCUMENTS: cmep-documents
      S3_BUCKET_MEDIA: cmep-media

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx ruff

      - name: Lint backend
        run: |
          python -m ruff check .

      - name: Run backend tests
        run: |
          pytest

      - name: Build backend image
        run: |
          docker build -t cmep-api:${{ github.sha }} -f Dockerfile .

      - name: Build worker image
        run: |
          docker build -t cmep-worker:${{ github.sha }} -f worker/Dockerfile .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Typecheck
        run: |
          npm run typecheck

      - name: Run frontend tests
        run: |
          npm run test

      - name: Build frontend
        run: |
          npm run build

      - name: Build frontend image
        run: |
          docker build -t cmep-web:${{ github.sha }} -f Dockerfile .