name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . 2>/dev/null || pip install -r requirements.txt
          pip install ruff ty pytest pytest-asyncio pytest-cov

      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      - name: Type check (ty)
        run: ty check

      - name: Pytest
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./test.db"
          JWT_SECRET_KEY: "ci-test-secret-key-min-32-chars-long-ok"
        run: pytest -q

      - name: Alembic sanity (SQLite)
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./alembic_check.db"
        run: |
          alembic upgrade head
          alembic check

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build --if-present
