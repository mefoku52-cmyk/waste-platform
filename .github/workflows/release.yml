name: Release Images

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/mefoku52-cmyk

jobs:
  release-images:
    name: Build and publish release images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # API: build z ROOT Dockerfile (python:3.14-slim, root requirements.txt so
      # stripe/edge-tts/apscheduler, USER cmep, HEALTHCHECK, dynamicky PORT).
      # POZOR: app/Dockerfile je stary (python:3.12) a instaloval z app/requirements.txt
      # — nepouzivat pre produkciu.
      - name: Build and push API
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/cmep-api:release-${GITHUB_SHA}"
          docker build -t "${IMAGE}" -f Dockerfile .
          docker push "${IMAGE}"

      # Worker: kontext = app/ (worker/Dockerfile COPY requirements.txt = app/requirements.txt,
      # ktory je teraz synchronizovany s root requirements.txt).
      - name: Build and push worker
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/cmep-worker:release-${GITHUB_SHA}"
          docker build -t "${IMAGE}" -f app/worker/Dockerfile app
          docker push "${IMAGE}"

      # Web: self-contained multi-stage build (npm ci + next build VNUTRI image),
      # runtime cez `next start`. Nevyzaduje output:'standalone'.
      - name: Build and push web
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/cmep-web:release-${GITHUB_SHA}"
          docker build -t "${IMAGE}" apps/web
          docker push "${IMAGE}"

      - name: Verify published manifests
        run: |
          set -euo pipefail

          docker manifest inspect \
            "${REGISTRY}/cmep-api:release-${GITHUB_SHA}" >/dev/null

          docker manifest inspect \
            "${REGISTRY}/cmep-worker:release-${GITHUB_SHA}" >/dev/null

          docker manifest inspect \
            "${REGISTRY}/cmep-web:release-${GITHUB_SHA}" >/dev/null

          echo "GHCR_MANIFESTS=PASS"

      - name: Release summary
        run: |
          {
            echo "## Release"
            echo
            echo "- RELEASE_ID: sha-${GITHUB_SHA}"
            echo "- IMAGE_TAG: release-${GITHUB_SHA}"
            echo "- API: ${REGISTRY}/cmep-api:release-${GITHUB_SHA}"
            echo "- WORKER: ${REGISTRY}/cmep-worker:release-${GITHUB_SHA}"
            echo "- WEB: ${REGISTRY}/cmep-web:release-${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
